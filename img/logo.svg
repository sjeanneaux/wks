<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005599;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded rectangle badge with WKS -->
  <rect x="4" y="4" width="68" height="72" rx="10" ry="10" fill="url(#grad1)" stroke="#002244" stroke-width="1.5"/>
  <!-- WKS letters -->
  <text x="38" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">WKS</text>
  <!-- Horizontal gold accent line -->
  <line x1="16" y1="44" x2="60" y2="44" stroke="#d4a017" stroke-width="2" stroke-linecap="round"/>
  <!-- Subtitle: Weilburg -->
  <text x="38" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">WEILBURG</text>
  <!-- Small gear + book icons below -->
  <circle cx="28" cy="68" r="4" fill="none" stroke="#d4a017" stroke-width="1"/>
  <circle cx="28" cy="68" r="1.5" fill="#d4a017"/>
  <g stroke="#d4a017" stroke-width="0.8">
    <line x1="28" y1="63" x2="28" y2="64"/>
    <line x1="28" y1="72" x2="28" y2="73"/>
    <line x1="23" y1="68" x2="24" y2="68"/>
    <line x1="32" y1="68" x2="33" y2="68"/>
  </g>
  <!-- Small open book icon -->
  <path d="M42 64 L48 62.5 L54 64 L54 72 L48 70.5 L42 72 Z" fill="none" stroke="#d4a017" stroke-width="1" stroke-linejoin="round"/>
  <line x1="48" y1="62.5" x2="48" y2="70.5" stroke="#d4a017" stroke-width="1"/>
  <!-- School name text -->
  <text x="88" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#003366" letter-spacing="0.3">Wilhelm-Knapp-Schule</text>
  <text x="88" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#005599" letter-spacing="0.5">Weilburg / Lahn</text>
  <line x1="88" y1="54" x2="180" y2="54" stroke="#d4a017" stroke-width="1.5" stroke-linecap="round"/>
  <text x="88" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#555555" letter-spacing="0.3">Selbstständige Berufliche Schule</text>
  <text x="88" y="77" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#777777" letter-spacing="0.3">des Landkreises Limburg-Weilburg</text>
</svg>
